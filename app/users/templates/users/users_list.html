{% extends 'base.html' %}

{% block content %}
<div class="container posts-container">
    <h1 class="mb-4">Користувачі ({{ users|length }})</h1>

    {% if users %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Ім'я користувача</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td>{{ user.username }}</td>
                        <td>{{ user.email }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-info">Поки що немає зареєстрованих користувачів.</div>
    {% endif %}
</div>
{% endblock %}
