{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="card-title">{{ product.name }}</h1>

            <p class="text-muted">ID товару: {{ product.id }}</p>

            <p>{{ product.content }}</p>

            <p class="fs-4 fw-bold">{{ product.price }} $</p>

            <a href="{{ url_for('products.product_list') }}"
               class="btn btn-outline-primary">
                Назад до товарів
            </a>
        </div>
    </div>
</div>
{% endblock %}
